name: Core tests

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor-and-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install pytest PyYAML 'numpy>=1.24,<2' h5py
      - name: Compile core entry points
        run: >-
          python -m compileall -q
          common/preflight.py common/run_state.py common/configuration.py
          common/method_provenance.py eval.py
          scripts/preflight.py scripts/run_benchmark.py
      - name: Run doctor, configuration, documentation, and resume tests
        run: >-
          python -m pytest -q
          tests/test_preflight.py
          tests/test_configuration.py
          tests/test_documentation.py
          tests/test_run_benchmark.py

  adapter-and-runtime-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install the base benchmark and test dependencies
        run: python -m pip install -e '.[dev,pathpt]'
      - name: Run adapter, loader, metric, and protocol regressions
        run: >-
          python -m pytest -q
          tests/test_focus_runtime.py
          tests/test_method_backbone_contracts.py
          tests/test_tcga_benchmark.py
