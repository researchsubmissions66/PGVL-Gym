name: Documentation

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: project-website/package-lock.json
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Check public API docstrings
        run: python scripts/check_docstrings.py
      - name: Build documentation
        run: python -m mkdocs build --strict
      - name: Install project website dependencies
        working-directory: project-website
        run: npm ci
      - name: Build static project website
        working-directory: project-website
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/project/
        run: npm run build:pages
      - name: Add project website to Pages artifact
        run: |
          mkdir -p site/project
          cp -R project-website/dist-pages/. site/project/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
