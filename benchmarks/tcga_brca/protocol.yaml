cohorts:
  brca:
    metadata_csv: /u/dchanda/PGVL-Gym/metadata/tcga_brca.csv
    label_column: OncoTreeCode
    labels:
    - IDC
    - ILC
    classnames:
    - invasive ductal carcinoma
    - invasive lobular carcinoma
    muse_prompt_csvs:
    - text_prompts/muse/tcga_brca/generated_new_0.csv
    - text_prompts/muse/tcga_brca/generated_new_1.csv
    focus_prompt_csv: text_prompts/focus/TCGA_BRCA_two_scale_text_prompt.csv
    mscpt_prompt_json: text_prompts/mscpt/description/TCGA_BRCA_IDC_ILC.json
    maple_prompt_json: text_prompts/maple/BRCA_attributes.json
    cod_prompt_json: text_prompts/cod_mil/brca_chain_of_diagnosis.json
    cod_prompt_features: text_prompts/cod_mil/brca_text_prompt_features_clip_rn50.pt
    slip_tissue_json: text_prompts/slip/tcga_brca_tissues.json
    sldpc_prompt_yaml: text_prompts/sldpc/tcga_brca.yaml
    wsi_report_csv: methods/wsi_five/gpt_preprocess/TCGA_Reports.csv
    convlm_attribute_embeddings: text_prompts/convlm/tcga_brca_quiltnet_attributes.pt
    prompts:
      top_instance: text_prompts/top/instance_prototypes.json
experiments:
  pathpt:
    method: pathpt
    features:
      bag: conch_v1_10x
    epochs: 20
  muse:
    method: muse
    features:
      bag: conch_v1_10x
    prompt_encoder: &id001
      name: conch
      weights: /work/hdd/bhwm/.cache_huggingface/hub/models--MahmoodLab--conch/snapshots/f9ca9f877171a28ade80228fb195ac5d79003357/pytorch_model.bin
      feature_space_id: hf:MahmoodLab/conch
    epochs: 200
  muse_keep:
    method: muse
    features:
      bag: keep_20x
    prompt_encoder: *id001
    epochs: 200
  focus:
    method: focus
    features:
      low: conch_v1_10x
      high: conch_v1_20x
    epochs: 200
  focus_5x20x:
    method: focus
    features:
      low: conch_v1_5x
      high: conch_v1_20x
    epochs: 200
  mscpt:
    method: mscpt
    features:
      low: conch_v1_10x
      high: conch_v1_20x
    epochs: 50
  mscpt_5x20x:
    method: mscpt
    features:
      low: conch_v1_5x
      high: conch_v1_20x
    epochs: 50
  pathpt_keep:
    method: pathpt
    features:
      bag: keep_20x
    epochs: 20
  sldpc:
    method: sldpc
    features:
      bag: titan_slide_20x
    prompt_encoder:
      name: titan
      weights: /work/hdd/bhwm/.cache_huggingface/hub/models--MahmoodLab--TITAN/snapshots/dac6773d9961cfc75503440676ff157a2c6e8d2e
      model_id: MahmoodLab/TITAN
      revision: dac6773d9961cfc75503440676ff157a2c6e8d2e
      feature_space_id: hf:MahmoodLab/TITAN@dac6773d9961cfc75503440676ff157a2c6e8d2e
      local_files_only: true
    slide_projection:
      mode: native
    epochs: 100
  top:
    method: top
    features:
      bag: clip_rn50_10x
    epochs: 8000
  pathpt_musk:
    method: pathpt
    features:
      bag: musk_10x
    epochs: 20
  muse_musk:
    method: muse
    features:
      bag: musk_10x
    epochs: 200
    prompt_encoder:
      name: conch
      weights: /work/hdd/bhwm/.cache_huggingface/hub/models--MahmoodLab--conch/snapshots/f9ca9f877171a28ade80228fb195ac5d79003357/pytorch_model.bin
      feature_space_id: hf:MahmoodLab/conch
