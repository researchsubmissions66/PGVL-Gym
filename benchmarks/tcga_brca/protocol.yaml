version: 3
name: tcga_brca_resolution_registry
seed: 1
folds: 5
shots:
- 4
- 8
- 16
train_slides_per_case: 1
val_slides_per_case: 1
test_slides: all
feature_sources:
  conch_v1_5x:
    resolution: 5x
    backbone: conch
    encoder_weights: ${PGVL_STORAGE_ROOT}/.cache_huggingface/hub/models--MahmoodLab--conch/snapshots/f9ca9f877171a28ade80228fb195ac5d79003357/pytorch_model.bin
    feature_key: features
    feature_dim: 512
    feature_space_id: hf:MahmoodLab/conch
    path_template: ${PGVL_STORAGE_ROOT}/trident_features/master_benchmark/5x_512px_0px_overlap/features_conch_v1/{slide_id}.h5
  conch_v1_10x:
    resolution: 10x
    backbone: conch
    encoder_weights: ${PGVL_STORAGE_ROOT}/.cache_huggingface/hub/models--MahmoodLab--conch/snapshots/f9ca9f877171a28ade80228fb195ac5d79003357/pytorch_model.bin
    feature_key: features
    feature_dim: 512
    feature_space_id: hf:MahmoodLab/conch
    path_template: ${PGVL_STORAGE_ROOT}/trident_features/master_benchmark/10x_256px_0px_overlap/features_conch_v1/{slide_id}.h5
  conch_v1_20x:
    resolution: 20x
    backbone: conch
    encoder_weights: ${PGVL_STORAGE_ROOT}/.cache_huggingface/hub/models--MahmoodLab--conch/snapshots/f9ca9f877171a28ade80228fb195ac5d79003357/pytorch_model.bin
    feature_key: features
    feature_dim: 512
    feature_space_id: hf:MahmoodLab/conch
    path_template: ${PGVL_STORAGE_ROOT}/trident_features/master_benchmark/20x_512px_0px_overlap/features_conch_v1/{slide_id}.h5
  keep_20x:
    resolution: 20x
    backbone: keep
    encoder_weights: ${PGVL_STORAGE_ROOT}/.cache_huggingface/hub/models--Astaxanthin--KEEP/snapshots/28a25d95cc6ba27a7e6fab3f144e13dbafd8b21e
    feature_key: features
    feature_dim: 768
    feature_space_id: hf:Astaxanthin/KEEP
    path_template: ${PGVL_STORAGE_ROOT}/trident_features/master_benchmark/20x_256px_0px_overlap/features_keep/{slide_id}.h5
  titan_slide_20x:
    input_kind: slide_embedding
    runtime_encoder: true
    resolution: 20x
    backbone: titan
    encoder_weights: ${PGVL_STORAGE_ROOT}/.cache_huggingface/hub/models--MahmoodLab--TITAN/snapshots/dac6773d9961cfc75503440676ff157a2c6e8d2e
    feature_key: features
    feature_dim: 768
    feature_space_id: hf:MahmoodLab/TITAN@dac6773d9961cfc75503440676ff157a2c6e8d2e
    path_template: ${PGVL_STORAGE_ROOT}/trident_features/master_benchmark/20x_512px_0px_overlap/slide_features_titan/{slide_id}.h5
  clip_rn50_10x:
    resolution: 10x
    backbone: clip-rn50
    encoder_weights: ${PGVL_USER_ROOT}/.cache/clip/RN50.pt
    feature_key: features
    feature_dim: 1024
    feature_space_id: openai/clip-rn50@official
    path_template: ${PGVL_STORAGE_ROOT}/trident_features/master_benchmark/10x_224px_0px_overlap/features_clip_rn50/{slide_id}.h5
  musk_10x:
    resolution: 10x
    backbone: musk
    encoder_weights: ${PGVL_STORAGE_ROOT}/.cache_huggingface/hub/models--xiangjx--musk/snapshots/de1ffed28608c197d2903f6fa42b491a3fbf0fb8/model.safetensors
    feature_key: features
    feature_dim: 1024
    feature_space_id: hf:xiangjx/musk
    path_template: ${PGVL_STORAGE_ROOT}/trident_features/master_benchmark/10x_384px_0px_overlap/features_musk/{slide_id}.h5
  clip_rn50_5x:
    resolution: 5x
    backbone: clip-rn50
    encoder_weights: ${PGVL_USER_ROOT}/.cache/clip/RN50.pt
    feature_key: features
    feature_dim: 1024
    feature_space_id: openai/clip-rn50@official
    path_template: ${PGVL_STORAGE_ROOT}/trident_features/master_benchmark/5x_224px_0px_overlap/features_clip_rn50/{slide_id}.h5
  clip_rn50_20x:
    resolution: 20x
    backbone: clip-rn50
    encoder_weights: ${PGVL_USER_ROOT}/.cache/clip/RN50.pt
    feature_key: features
    feature_dim: 1024
    feature_space_id: openai/clip-rn50@official
    path_template: ${PGVL_STORAGE_ROOT}/trident_features/master_benchmark/20x_224px_0px_overlap/features_clip_rn50/{slide_id}.h5
cohorts:
  brca:
    metadata_csv: ${PGVL_REPO_ROOT}/metadata/tcga_brca.csv
    label_column: OncoTreeCode
    labels:
    - IDC
    - ILC
    classnames:
    - invasive ductal carcinoma
    - invasive lobular carcinoma
    muse_prompt_csvs:
    - text_prompts/muse/tcga_brca/generated_new_0.csv
    - text_prompts/muse/tcga_brca/generated_new_1.csv
    focus_prompt_csv: text_prompts/focus/TCGA_BRCA_two_scale_text_prompt.csv
    mscpt_prompt_json: text_prompts/mscpt/description/TCGA_BRCA_IDC_ILC.json
    maple_prompt_json: text_prompts/maple/BRCA_attributes.json
    cod_prompt_json: text_prompts/cod_mil/brca_chain_of_diagnosis.json
    # CoD-MIL's second diagnostic chain contrasts against normal tissue.
    # Upstream ships that bank for kidney only, so these breast structures
    # are authored here (prompt_provenance: generated), combined with the
    # 15 organ-independent rows reused verbatim from the released bank.
    cod_normal_structures_json: text_prompts/cod_mil/brca_normal_structures.json
    # No `cod_prompt_features` here: CoD-MIL's published CLIP embeddings exist
    # only for RCC. Omitting the key selects `prompt_encoding: runtime_cached`,
    # which encodes the chain JSON with the same CLIP RN50 that produced the
    # patch features. Declaring a .pt that was never released would fail config
    # generation the moment a cod_mil experiment is added.
    slip_tissue_json: text_prompts/slip/tcga_brca_tissues.json
    sldpc_prompt_yaml: text_prompts/sldpc/tcga_brca.yaml
    wsi_report_csv: methods/wsi_five/gpt_preprocess/TCGA_Reports.csv
    # Questions authored here; the released set is lung-specific. Reports are
    # free text, not answers to these questions, so this is doubly generated.
    wsi_five_questions_json: text_prompts/wsi_five/clinical_questions/brca.json
    prompts:
      # TOP's task-agnostic instance bank is copied from released code. TOP did
      # not publish a BRCA bag initializer, so this extension deliberately uses
      # learned random bag context plus the configured IDC/ILC classnames.
      top_instance: text_prompts/top/instance_prototypes.json
      vila_mil: text_prompts/focus/TCGA_BRCA_two_scale_text_prompt.csv
experiments:
  pathpt:
    method: pathpt
    training_mode: upstream_patch_ssl
    features:
      bag: conch_v1_10x
    epochs: 20
  muse:
    method: muse
    features:
      bag: conch_v1_10x
    prompt_encoder: &id001
      name: conch
      weights: ${PGVL_STORAGE_ROOT}/.cache_huggingface/hub/models--MahmoodLab--conch/snapshots/f9ca9f877171a28ade80228fb195ac5d79003357/pytorch_model.bin
      feature_space_id: hf:MahmoodLab/conch
    epochs: 200
  muse_keep:
    method: muse
    features:
      bag: keep_20x
    prompt_encoder: *id001
    epochs: 200
  focus:
    method: focus
    features:
      high: conch_v1_20x
    epochs: 200
  mscpt:
    method: mscpt
    features:
      low: conch_v1_10x
      high: conch_v1_20x
    epochs: 50
  mscpt_5x20x:
    method: mscpt
    features:
      low: conch_v1_5x
      high: conch_v1_20x
    epochs: 50
  pathpt_keep:
    method: pathpt
    training_mode: upstream_patch_ssl
    features:
      bag: keep_20x
    epochs: 20
  sldpc:
    method: sldpc
    features:
      bag: titan_slide_20x
    prompt_encoder:
      name: titan
      weights: ${PGVL_STORAGE_ROOT}/.cache_huggingface/hub/models--MahmoodLab--TITAN/snapshots/dac6773d9961cfc75503440676ff157a2c6e8d2e
      model_id: MahmoodLab/TITAN
      revision: dac6773d9961cfc75503440676ff157a2c6e8d2e
      feature_space_id: hf:MahmoodLab/TITAN@dac6773d9961cfc75503440676ff157a2c6e8d2e
      local_files_only: true
    slide_projection:
      mode: native
    epochs: 100
  top:
    method: top
    features:
      bag: clip_rn50_10x
    epochs: 8000
  pathpt_musk:
    method: pathpt
    training_mode: upstream_patch_ssl
    features:
      bag: musk_10x
    epochs: 20
  muse_musk:
    method: muse
    features:
      bag: musk_10x
    epochs: 200
    prompt_encoder:
      name: conch
      weights: ${PGVL_STORAGE_ROOT}/.cache_huggingface/hub/models--MahmoodLab--conch/snapshots/f9ca9f877171a28ade80228fb195ac5d79003357/pytorch_model.bin
      feature_space_id: hf:MahmoodLab/conch
  vila_mil:
    method: vila_mil
    features:
      low: clip_rn50_5x
      high: clip_rn50_20x
    epochs: 200
  # 10x/20x, matching upstream's `map_10x_20x_files` and Table I of the paper,
  # which reports 10x and 20x patches for all three of its datasets. CoD-MIL's
  # second stage zooms from a chosen low-power patch into the high-power patches
  # inside it, so the pair must be the one its correspondence maps were built
  # for. Those maps live in maps/cod_mil/clip_rn50_10x__clip_rn50_20x and are
  # generated by scripts/generate_cross_magnification_maps.py; upstream
  # distributes neither the maps nor a generator for them.
  #
  # NOT COMPARABLE TO PUBLISHED NUMBERS: upstream's create_patches_fp.py
  # defaults to 256 px patches at stride 256, while this store holds 224 px
  # patches. The patch grid therefore differs, so a 10x tile here covers a
  # different tissue area than theirs and the instance counts do not match
  # Table I. The method is reproduced; the numbers are not directly comparable.
  # SLIP routes a patch bag through a vocabulary of tissue phenotypes, so it
  # needs a single-scale bag in a paired space its contract allows. CLIP RN50 is
  # native for SLIP and BRCA has full 960/960 coverage, so this costs no
  # extraction. Its recipe is lr 2e-3 / 10 epochs, set by the generator.
  slip:
    method: slip
    features:
      bag: clip_rn50_10x
    epochs: 10
  cod_mil:
    method: cod_mil
    features:
      low: clip_rn50_10x
      high: clip_rn50_20x
    epochs: 200
