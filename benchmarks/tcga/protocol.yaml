version: 3
name: tcga_nsclc_brca_rcc_resolution_registry

# Folds use annotations only; feature availability cannot alter membership.
seed: 1
folds: 5
shots: [4, 8, 16]
train_slides_per_case: 1
val_slides_per_case: 1
test_slides: all

feature_sources:
  conch_v1_5x:
    resolution: 5x
    backbone: conch
    encoder_weights: /path/to/model-cache/huggingface/hub/models--MahmoodLab--conch/snapshots/f9ca9f877171a28ade80228fb195ac5d79003357/pytorch_model.bin
    feature_key: features
    feature_dim: 512
    feature_space_id: hf:MahmoodLab/conch
    path_template: /path/to/features/master_benchmark/5x_256px_0px_overlap/features_conch_v1/{slide_id}.h5
  conch_v1_10x:
    resolution: 10x
    backbone: conch
    encoder_weights: /path/to/model-cache/huggingface/hub/models--MahmoodLab--conch/snapshots/f9ca9f877171a28ade80228fb195ac5d79003357/pytorch_model.bin
    feature_key: features
    feature_dim: 512
    feature_space_id: hf:MahmoodLab/conch
    path_template: /path/to/features/master_benchmark/10x_256px_0px_overlap/features_conch_v1/{slide_id}.h5
  conch_v1_20x:
    resolution: 20x
    backbone: conch
    encoder_weights: /path/to/model-cache/huggingface/hub/models--MahmoodLab--conch/snapshots/f9ca9f877171a28ade80228fb195ac5d79003357/pytorch_model.bin
    feature_key: features
    feature_dim: 512
    feature_space_id: hf:MahmoodLab/conch
    # This must remain CONCH-v1. Never substitute 768-wide CONCH-v1.5.
    path_template: /path/to/features/master_benchmark/20x_512px_0px_overlap/features_conch_v1/{slide_id}.h5
  musk_10x:
    resolution: 10x
    backbone: musk
    encoder_weights: /path/to/model-cache/model.safetensors
    feature_key: features
    feature_dim: 1024
    feature_space_id: hf:xiangjx/musk
    path_template: /path/to/features/master_benchmark/10x_384px_0px_overlap/features_musk/{slide_id}.h5
  keep_20x:
    resolution: 20x
    backbone: keep
    encoder_weights: /path/to/model-cache/huggingface/hub/models--Astaxanthin--KEEP/snapshots/28a25d95cc6ba27a7e6fab3f144e13dbafd8b21e
    feature_key: features
    feature_dim: 768
    feature_space_id: hf:Astaxanthin/KEEP
    path_template: /path/to/features/master_benchmark/20x_256px_0px_overlap/features_keep/{slide_id}.h5
  plip_5x:
    resolution: 5x
    backbone: plip
    encoder_weights: /path/to/model-cache/huggingface/hub/models--vinid--plip/snapshots/67ade53ddd32195868f422585f72698ef5d15094
    feature_key: features
    feature_dim: 512
    feature_space_id: hf:vinid/plip
    path_template: /path/to/features/master_benchmark/5x_224px_0px_overlap/features_plip/{slide_id}.h5
  plip_10x:
    resolution: 10x
    backbone: plip
    encoder_weights: /path/to/model-cache/huggingface/hub/models--vinid--plip/snapshots/67ade53ddd32195868f422585f72698ef5d15094
    feature_key: features
    feature_dim: 512
    feature_space_id: hf:vinid/plip
    path_template: /path/to/features/master_benchmark/10x_224px_0px_overlap/features_plip/{slide_id}.h5
  plip_20x:
    resolution: 20x
    backbone: plip
    encoder_weights: /path/to/model-cache/huggingface/hub/models--vinid--plip/snapshots/67ade53ddd32195868f422585f72698ef5d15094
    feature_key: features
    feature_dim: 512
    feature_space_id: hf:vinid/plip
    path_template: /path/to/features/master_benchmark/20x_224px_0px_overlap/features_plip/{slide_id}.h5
  clip_rn50_5x:
    input_kind: patch_bag
    availability: future
    resolution: 5x
    backbone: clip-rn50
    encoder_weights: /path/to/model-cache/clip/RN50.pt
    feature_key: features
    feature_dim: 1024
    feature_space_id: openai/clip-rn50@official
    path_template: /path/to/features/master_benchmark/5x_224px_0px_overlap/features_clip_rn50/{slide_id}.h5
  clip_rn50_10x:
    input_kind: patch_bag
    availability: future
    resolution: 10x
    backbone: clip-rn50
    encoder_weights: /path/to/model-cache/clip/RN50.pt
    feature_key: features
    feature_dim: 1024
    feature_space_id: openai/clip-rn50@official
    path_template: /path/to/features/master_benchmark/10x_224px_0px_overlap/features_clip_rn50/{slide_id}.h5
  clip_rn50_20x:
    input_kind: patch_bag
    availability: future
    resolution: 20x
    backbone: clip-rn50
    encoder_weights: /path/to/model-cache/clip/RN50.pt
    feature_key: features
    feature_dim: 1024
    feature_space_id: openai/clip-rn50@official
    path_template: /path/to/features/master_benchmark/20x_224px_0px_overlap/features_clip_rn50/{slide_id}.h5
  titan_slide_20x:
    input_kind: slide_embedding
    runtime_encoder: true
    resolution: 20x
    backbone: titan
    encoder_weights: /path/to/model-cache/huggingface/hub/models--MahmoodLab--TITAN/snapshots/dac6773d9961cfc75503440676ff157a2c6e8d2e
    feature_key: features
    feature_dim: 768
    feature_space_id: hf:MahmoodLab/TITAN@dac6773d9961cfc75503440676ff157a2c6e8d2e
    path_template: /path/to/features/master_benchmark/20x_512px_0px_overlap/slide_features_titan/{slide_id}.h5
  wsi_five_medclip_20x:
    input_kind: patch_sequence
    availability: future
    model_owned: true
    resolution: 20x
    backbone: wsi-five-vit
    encoder_weights: /path/to/PGVL-Gym/checkpoints/wsi_five/medclip_vit.bin
    feature_key: features
    feature_dim: 512
    feature_space_id: upstream:wsi-five-medclip-vit
    path_template: /path/to/features/master_benchmark/20x_224px_0px_overlap/features_wsi_five_medclip/{slide_id}.h5
  convlm_raw_tiles_20x:
    input_kind: raw_tile_directory
    availability: future
    model_owned: true
    initialization: scratch
    resolution: 20x
    backbone: convlm-vit
    encoder_weights: null
    feature_key: null
    feature_dim: null
    feature_space_id: rgb:imagenet-normalized
    path_template: /path/to/features/master_benchmark/20x_448px_0px_overlap/raw_tiles_convlm/{slide_id}

cohorts:
  nsclc:
    metadata_csv: /path/to/metadata/MAPLE/dataset_csv/tcga_lung.csv
    label_column: OncoTreeCode
    labels: [LUAD, LUSC]
    classnames:
      - lung adenocarcinoma
      - lung squamous cell carcinoma
    muse_prompt_csvs:
      - text_prompts/muse/tcga_nsclc/generated_new_0.csv
      - text_prompts/muse/tcga_nsclc/generated_new_1.csv
    focus_prompt_csv: text_prompts/focus/TCGA_NSCLC_two_scale_text_prompt.csv
    mscpt_prompt_json: train_data/gpt/description/Lung.json
    maple_prompt_json: text_prompts/maple/LUNG_attributes.json
    cod_prompt_json: text_prompts/cod_mil/nsclc_chain_of_diagnosis.json
    cod_prompt_features: text_prompts/cod_mil/nsclc_text_prompt_features_clip_rn50.pt
    slip_tissue_json: text_prompts/slip/tcga_nsclc_tissues.json
    sldpc_prompt_yaml: text_prompts/sldpc/tcga_nsclc.yaml
    wsi_report_csv: methods/wsi_five/gpt_preprocess/TCGA_Reports.csv
    convlm_attribute_embeddings: text_prompts/convlm/tcga_nsclc_quiltnet_attributes.pt
  brca:
    metadata_csv: /path/to/metadata/MAPLE/dataset_csv/tcga_brca.csv
    label_column: OncoTreeCode
    labels: [IDC, ILC]
    classnames:
      - invasive ductal carcinoma
      - invasive lobular carcinoma
    muse_prompt_csvs:
      - text_prompts/muse/tcga_brca/generated_new_0.csv
      - text_prompts/muse/tcga_brca/generated_new_1.csv
    focus_prompt_csv: text_prompts/focus/TCGA_BRCA_two_scale_text_prompt.csv
    mscpt_prompt_json: text_prompts/mscpt/description/TCGA_BRCA_IDC_ILC.json
    maple_prompt_json: text_prompts/maple/BRCA_attributes.json
    cod_prompt_json: text_prompts/cod_mil/brca_chain_of_diagnosis.json
    cod_prompt_features: text_prompts/cod_mil/brca_text_prompt_features_clip_rn50.pt
    slip_tissue_json: text_prompts/slip/tcga_brca_tissues.json
    sldpc_prompt_yaml: text_prompts/sldpc/tcga_brca.yaml
    wsi_report_csv: methods/wsi_five/gpt_preprocess/TCGA_Reports.csv
    convlm_attribute_embeddings: text_prompts/convlm/tcga_brca_quiltnet_attributes.pt
  rcc:
    metadata_csv: /path/to/metadata/MAPLE/dataset_csv/tcga_rcc.csv
    label_column: OncoTreeCode
    labels: [CCRCC, PRCC, CHRCC]
    classnames:
      - clear cell renal cell carcinoma
      - papillary renal cell carcinoma
      - chromophobe renal cell carcinoma
    muse_prompt_json: train_data/gpt/description/RCC.json
    focus_prompt_csv: text_prompts/focus/TCGA_RCC_two_scale_text_prompt.csv
    mscpt_prompt_json: train_data/gpt/description/RCC.json
    maple_prompt_json: text_prompts/maple/RCC_attributes.json
    cod_prompt_json: text_prompts/cod_mil/rcc_chain_of_diagnosis.json
    cod_prompt_features: text_prompts/cod_mil/rcc_text_prompt_features_clip.pt
    slip_tissue_json: text_prompts/slip/tcga_rcc_tissues.json
    sldpc_prompt_yaml: text_prompts/sldpc/tcga_rcc.yaml
    wsi_report_csv: methods/wsi_five/gpt_preprocess/TCGA_Reports.csv
    convlm_attribute_embeddings: text_prompts/convlm/tcga_rcc_quiltnet_attributes.pt

experiments:
  pathpt:
    method: pathpt
    features: {bag: conch_v1_10x}
    epochs: 20
  muse:
    method: muse
    features: {bag: conch_v1_10x}
    prompt_encoder: &muse_conch_prompt_encoder
      name: conch
      weights: /path/to/model-cache/huggingface/hub/models--MahmoodLab--conch/snapshots/f9ca9f877171a28ade80228fb195ac5d79003357/pytorch_model.bin
      feature_space_id: hf:MahmoodLab/conch
    epochs: 200
  muse_musk:
    method: muse
    features: {bag: musk_10x}
    prompt_encoder: *muse_conch_prompt_encoder
    epochs: 200
  muse_keep:
    method: muse
    features: {bag: keep_20x}
    prompt_encoder: *muse_conch_prompt_encoder
    epochs: 200
  focus:
    method: focus
    features: {low: conch_v1_10x, high: conch_v1_20x}
    epochs: 200
  focus_5x20x:
    method: focus
    features: {low: conch_v1_5x, high: conch_v1_20x}
    epochs: 200
  mscpt:
    method: mscpt
    features: {low: conch_v1_10x, high: conch_v1_20x}
    epochs: 50
  mscpt_5x20x:
    method: mscpt
    features: {low: conch_v1_5x, high: conch_v1_20x}
    epochs: 50
  maple:
    method: maple
    features: {low: plip_10x, high: plip_20x}
    epochs: 200
  maple_5x20x:
    method: maple
    features: {low: plip_5x, high: plip_20x}
    epochs: 200
  pathpt_musk:
    method: pathpt
    features: {bag: musk_10x}
    epochs: 20
  pathpt_keep:
    method: pathpt
    features: {bag: keep_20x}
    epochs: 20
  vila_mil:
    method: vila_mil
    features: {low: clip_rn50_5x, high: clip_rn50_20x}
    epochs: 200
  cod_mil:
    method: cod_mil
    features: {low: clip_rn50_5x, high: clip_rn50_20x}
    epochs: 200
  top:
    method: top
    features: {bag: clip_rn50_10x}
    epochs: 8000
  slip:
    method: slip
    features: {bag: clip_rn50_10x}
    epochs: 10
  wsi_five:
    method: wsi_five
    features: {bag: wsi_five_medclip_20x}
    epochs: 30
  sldpc:
    method: sldpc
    features: {bag: titan_slide_20x}
    # The offline slide encoder and runtime prompt backbone are independent.
    # For another slide encoder, register its embedding source above and use
    # slide_projection.mode: linear or mlp. Native requires a paired encoder.
    prompt_encoder:
      name: titan
      weights: /path/to/model-cache/huggingface/hub/models--MahmoodLab--TITAN/snapshots/dac6773d9961cfc75503440676ff157a2c6e8d2e
      model_id: MahmoodLab/TITAN
      revision: dac6773d9961cfc75503440676ff157a2c6e8d2e
      feature_space_id: hf:MahmoodLab/TITAN@dac6773d9961cfc75503440676ff157a2c6e8d2e
      local_files_only: true
    slide_projection: {mode: native}
    epochs: 100
  convlm:
    method: convlm
    features: {tiles: convlm_raw_tiles_20x}
    epochs: 40
  composite:
    method: composite
    features: {bag: clip_rn50_10x}
    epochs: 200
