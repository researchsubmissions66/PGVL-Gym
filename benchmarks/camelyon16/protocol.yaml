version: 3
name: camelyon16_resolution_registry
results_namespace: camelyon16_benchmark
seed: 1
folds: 5
shots:
- 4
- 8
- 16
train_slides_per_case: 1
val_slides_per_case: 1
test_slides: all
feature_sources:
  conch_v1_5x:
    availability: future
    resolution: 5x
    backbone: conch
    encoder_weights: /work/hdd/bhwm/.cache_huggingface/hub/models--MahmoodLab--conch/snapshots/f9ca9f877171a28ade80228fb195ac5d79003357/pytorch_model.bin
    feature_key: features
    feature_dim: 512
    feature_space_id: hf:MahmoodLab/conch
    path_template: /work/hdd/bhwm/CAMELYON16/5x_256px_0px_overlap/features_conch_v1/{slide_id}.h5
  conch_v1_10x:
    availability: future
    resolution: 10x
    backbone: conch
    encoder_weights: /work/hdd/bhwm/.cache_huggingface/hub/models--MahmoodLab--conch/snapshots/f9ca9f877171a28ade80228fb195ac5d79003357/pytorch_model.bin
    feature_key: features
    feature_dim: 512
    feature_space_id: hf:MahmoodLab/conch
    path_template: /work/hdd/bhwm/CAMELYON16/10x_256px_0px_overlap/features_conch_v1/{slide_id}.h5
  conch_v1_20x:
    availability: future
    resolution: 20x
    backbone: conch
    encoder_weights: /work/hdd/bhwm/.cache_huggingface/hub/models--MahmoodLab--conch/snapshots/f9ca9f877171a28ade80228fb195ac5d79003357/pytorch_model.bin
    feature_key: features
    feature_dim: 512
    feature_space_id: hf:MahmoodLab/conch
    path_template: /work/hdd/bhwm/CAMELYON16/20x_256px_0px_overlap/features_conch_v1/{slide_id}.h5
  keep_20x:
    availability: future
    resolution: 20x
    backbone: keep
    encoder_weights: /work/hdd/bhwm/.cache_huggingface/hub/models--Astaxanthin--KEEP/snapshots/28a25d95cc6ba27a7e6fab3f144e13dbafd8b21e
    feature_key: features
    feature_dim: 768
    feature_space_id: hf:Astaxanthin/KEEP
    path_template: /work/hdd/bhwm/CAMELYON16/20x_256px_0px_overlap/features_keep/{slide_id}.h5
cohorts:
  camelyon16:
    metadata_csvs:
    - path: /work/hdd/bhwm/metadata/RAW_DATA_Cleaned/CAMELYON16/CAM16_data_train.csv
      partition: official_train
    - path: /work/hdd/bhwm/metadata/RAW_DATA_Cleaned/CAMELYON16/CAM16_data_test.csv
      partition: official_test
    slide_id_column: source_filename
    # The release names slides with a .tif extension and the cleaned tables keep
    # it, but feature files are written per slide stem. Without this the slide id
    # would stay "normal_001.tif" and every feature lookup would miss.
    slide_suffixes:
    - .tif
    case_id_column: patient_id
    label_column: cancer_type
    label_transform: lower
    labels:
    - normal
    - tumor
    classnames:
    - normal lymph node
    - metastatic lymph node
    prompt_spec: benchmarks/camelyon16/prompts/camelyon16.yaml
    muse_prompt_csvs:
    - text_prompts/muse/camelyon_all/generated_new_0.csv
    - text_prompts/muse/camelyon_all/generated_new_1.csv
    focus_prompt_csv: text_prompts/focus/CAMELYON16_two_scale_text_prompt.csv
    slip_tissue_json: text_prompts/slip/camelyon16_tissues.json
    sldpc_prompt_yaml: text_prompts/sldpc/camelyon16.yaml
experiments:
  pathpt:
    method: pathpt
    features:
      bag: conch_v1_10x
    epochs: 20
  pathpt_keep:
    method: pathpt
    features:
      bag: keep_20x
    epochs: 20
  muse:
    method: muse
    features:
      bag: conch_v1_10x
    prompt_encoder: &id001
      name: conch
      weights: /work/hdd/bhwm/.cache_huggingface/hub/models--MahmoodLab--conch/snapshots/f9ca9f877171a28ade80228fb195ac5d79003357/pytorch_model.bin
      feature_space_id: hf:MahmoodLab/conch
    epochs: 200
  muse_keep:
    method: muse
    features:
      bag: keep_20x
    prompt_encoder: *id001
    epochs: 200
  focus:
    method: focus
    features:
      low: conch_v1_10x
      high: conch_v1_20x
    epochs: 200
  focus_5x20x:
    method: focus
    features:
      low: conch_v1_5x
      high: conch_v1_20x
    epochs: 200
  mscpt:
    method: mscpt
    features:
      low: conch_v1_10x
      high: conch_v1_20x
    epochs: 50
  mscpt_5x20x:
    method: mscpt
    features:
      low: conch_v1_5x
      high: conch_v1_20x
    epochs: 50
