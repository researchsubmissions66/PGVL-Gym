version: 3
name: camelyon16_ubc_ocean_resolution_registry
results_namespace: additional_tasks_benchmark

# Identical controls across tasks and methods. Task membership is annotation
# defined; feature availability never changes a fold.
seed: 1
folds: 5
shots: [4, 8, 16]
train_slides_per_case: 1
val_slides_per_case: 1
test_slides: all

feature_sources:
  conch_v1_5x:
    availability: future
    resolution: 5x
    backbone: conch
    encoder_weights: /path/to/model-cache/huggingface/hub/models--MahmoodLab--conch/snapshots/f9ca9f877171a28ade80228fb195ac5d79003357/pytorch_model.bin
    feature_key: features
    feature_dim: 512
    feature_space_id: hf:MahmoodLab/conch
    path_template: "/path/to/features/additional_tasks/{task}/5x_256px_0px_overlap/features_conch_v1/{slide_id}.h5"
  conch_v1_10x:
    availability: future
    resolution: 10x
    backbone: conch
    encoder_weights: /path/to/model-cache/huggingface/hub/models--MahmoodLab--conch/snapshots/f9ca9f877171a28ade80228fb195ac5d79003357/pytorch_model.bin
    feature_key: features
    feature_dim: 512
    feature_space_id: hf:MahmoodLab/conch
    path_template: "/path/to/features/additional_tasks/{task}/10x_256px_0px_overlap/features_conch_v1/{slide_id}.h5"
  conch_v1_20x:
    availability: future
    resolution: 20x
    backbone: conch
    encoder_weights: /path/to/model-cache/huggingface/hub/models--MahmoodLab--conch/snapshots/f9ca9f877171a28ade80228fb195ac5d79003357/pytorch_model.bin
    feature_key: features
    feature_dim: 512
    feature_space_id: hf:MahmoodLab/conch
    path_template: "/path/to/features/additional_tasks/{task}/20x_512px_0px_overlap/features_conch_v1/{slide_id}.h5"
  musk_10x:
    availability: future
    resolution: 10x
    backbone: musk
    encoder_weights: /path/to/model-cache/model.safetensors
    feature_key: features
    feature_dim: 1024
    feature_space_id: hf:xiangjx/musk
    path_template: "/path/to/features/additional_tasks/{task}/10x_384px_0px_overlap/features_musk/{slide_id}.h5"
  keep_20x:
    availability: future
    resolution: 20x
    backbone: keep
    encoder_weights: /path/to/model-cache/huggingface/hub/models--Astaxanthin--KEEP/snapshots/28a25d95cc6ba27a7e6fab3f144e13dbafd8b21e
    feature_key: features
    feature_dim: 768
    feature_space_id: hf:Astaxanthin/KEEP
    path_template: "/path/to/features/additional_tasks/{task}/20x_256px_0px_overlap/features_keep/{slide_id}.h5"
  plip_5x:
    availability: future
    resolution: 5x
    backbone: plip
    encoder_weights: /path/to/model-cache/huggingface/hub/models--vinid--plip/snapshots/67ade53ddd32195868f422585f72698ef5d15094
    feature_key: features
    feature_dim: 512
    feature_space_id: hf:vinid/plip
    path_template: "/path/to/features/additional_tasks/{task}/5x_224px_0px_overlap/features_plip/{slide_id}.h5"
  plip_10x:
    availability: future
    resolution: 10x
    backbone: plip
    encoder_weights: /path/to/model-cache/huggingface/hub/models--vinid--plip/snapshots/67ade53ddd32195868f422585f72698ef5d15094
    feature_key: features
    feature_dim: 512
    feature_space_id: hf:vinid/plip
    path_template: "/path/to/features/additional_tasks/{task}/10x_224px_0px_overlap/features_plip/{slide_id}.h5"
  plip_20x:
    availability: future
    resolution: 20x
    backbone: plip
    encoder_weights: /path/to/model-cache/huggingface/hub/models--vinid--plip/snapshots/67ade53ddd32195868f422585f72698ef5d15094
    feature_key: features
    feature_dim: 512
    feature_space_id: hf:vinid/plip
    path_template: "/path/to/features/additional_tasks/{task}/20x_224px_0px_overlap/features_plip/{slide_id}.h5"
  clip_rn50_5x:
    input_kind: patch_bag
    availability: future
    resolution: 5x
    backbone: clip-rn50
    encoder_weights: /path/to/model-cache/clip/RN50.pt
    feature_key: features
    feature_dim: 1024
    feature_space_id: openai/clip-rn50@official
    path_template: "/path/to/features/additional_tasks/{task}/5x_224px_0px_overlap/features_clip_rn50/{slide_id}.h5"
  clip_rn50_10x:
    input_kind: patch_bag
    availability: future
    resolution: 10x
    backbone: clip-rn50
    encoder_weights: /path/to/model-cache/clip/RN50.pt
    feature_key: features
    feature_dim: 1024
    feature_space_id: openai/clip-rn50@official
    path_template: "/path/to/features/additional_tasks/{task}/10x_224px_0px_overlap/features_clip_rn50/{slide_id}.h5"
  clip_rn50_20x:
    input_kind: patch_bag
    availability: future
    resolution: 20x
    backbone: clip-rn50
    encoder_weights: /path/to/model-cache/clip/RN50.pt
    feature_key: features
    feature_dim: 1024
    feature_space_id: openai/clip-rn50@official
    path_template: "/path/to/features/additional_tasks/{task}/20x_224px_0px_overlap/features_clip_rn50/{slide_id}.h5"
  titan_slide_20x:
    input_kind: slide_embedding
    runtime_encoder: true
    availability: future
    resolution: 20x
    backbone: titan
    encoder_weights: /path/to/model-cache/huggingface/hub/models--MahmoodLab--TITAN/snapshots/dac6773d9961cfc75503440676ff157a2c6e8d2e
    feature_key: features
    feature_dim: 768
    feature_space_id: hf:MahmoodLab/TITAN@dac6773d9961cfc75503440676ff157a2c6e8d2e
    path_template: "/path/to/features/additional_tasks/{task}/20x_512px_0px_overlap/slide_features_titan/{slide_id}.h5"
  wsi_five_medclip_20x:
    input_kind: patch_sequence
    availability: future
    model_owned: true
    initialization: scratch
    resolution: 20x
    backbone: wsi-five-vit
    encoder_weights: null
    feature_key: features
    feature_dim: 512
    feature_space_id: wsi-five/medclip-patch@official
    path_template: "/path/to/features/additional_tasks/{task}/20x_224px_0px_overlap/features_wsi_five_medclip/{slide_id}.pt"
  convlm_raw_tiles_20x:
    input_kind: raw_tile_directory
    availability: future
    model_owned: true
    initialization: scratch
    resolution: 20x
    backbone: convlm-vit
    encoder_weights: null
    feature_key: null
    feature_dim: null
    feature_space_id: rgb:imagenet-normalized
    path_template: "/path/to/features/additional_tasks/{task}/20x_448px_0px_overlap/raw_tiles_convlm/{slide_id}"

cohorts:
  camelyon16:
    metadata_csvs:
      - path: /path/to/metadata/FiVE_repo/data/CAMELYON16/CAM16_data_train.csv
        partition: official_train
      - path: /path/to/metadata/FiVE_repo/data/CAMELYON16/CAM16_data_test.csv
        partition: official_test
    slide_id_column: source_filename
    case_id_column: patient_id
    label_column: cancer_type
    label_transform: lower
    labels: [normal, tumor]
    classnames: [normal lymph node, metastatic lymph node]
    prompt_spec: benchmarks/additional_tasks/prompts/camelyon16.yaml
    muse_prompt_csvs:
      - text_prompts/muse/camelyon_all/generated_new_0.csv
      - text_prompts/muse/camelyon_all/generated_new_1.csv
    focus_prompt_csv: text_prompts/focus/CAMELYON16_two_scale_text_prompt.csv
    slip_tissue_json: text_prompts/slip/camelyon16_tissues.json
    sldpc_prompt_yaml: text_prompts/sldpc/camelyon16.yaml
  ubc_ocean:
    metadata_csv: /path/to/PGVL-Gym/benchmarks/additional_tasks/metadata/ubc_ocean.csv
    metadata_availability: future
    slide_id_column: image_id
    case_id_column: image_id
    slide_suffixes: []
    label_column: label
    # Patch-based WSI methods are not comparable to the small TMA composites.
    filters: {is_tma: false}
    labels: [CC, EC, HGSC, LGSC, MC]
    classnames:
      - ovarian clear cell carcinoma
      - ovarian endometrioid carcinoma
      - ovarian high-grade serous carcinoma
      - ovarian low-grade serous carcinoma
      - ovarian mucinous carcinoma
    prompt_spec: benchmarks/additional_tasks/prompts/ubc_ocean.yaml
    muse_prompt_json: train_data/gpt/description/UBC-OCEAN.json
    focus_prompt_csv: text_prompts/focus/UBC_OCEAN_two_scale_text_prompt.csv
    mscpt_prompt_json: train_data/gpt/description/UBC-OCEAN.json
    # MAPLE attributes are deterministically derived from the same released
    # multiscale description bank during config generation.
    slip_tissue_json: text_prompts/slip/ubc_ocean_tissues.json
    sldpc_prompt_yaml: text_prompts/sldpc/ubc_ocean.yaml

experiments:
  pathpt:
    method: pathpt
    features: {bag: conch_v1_10x}
    epochs: 20
  pathpt_musk:
    method: pathpt
    features: {bag: musk_10x}
    epochs: 20
  pathpt_keep:
    method: pathpt
    features: {bag: keep_20x}
    epochs: 20
  muse:
    method: muse
    features: {bag: conch_v1_10x}
    prompt_encoder: &conch_prompt_encoder
      name: conch
      weights: /path/to/model-cache/huggingface/hub/models--MahmoodLab--conch/snapshots/f9ca9f877171a28ade80228fb195ac5d79003357/pytorch_model.bin
      feature_space_id: hf:MahmoodLab/conch
    epochs: 200
  muse_musk:
    method: muse
    features: {bag: musk_10x}
    prompt_encoder: *conch_prompt_encoder
    epochs: 200
  muse_keep:
    method: muse
    features: {bag: keep_20x}
    prompt_encoder: *conch_prompt_encoder
    epochs: 200
  focus:
    method: focus
    features: {low: conch_v1_10x, high: conch_v1_20x}
    epochs: 200
  focus_5x20x:
    method: focus
    features: {low: conch_v1_5x, high: conch_v1_20x}
    epochs: 200
  mscpt:
    method: mscpt
    features: {low: conch_v1_10x, high: conch_v1_20x}
    epochs: 50
  mscpt_5x20x:
    method: mscpt
    features: {low: conch_v1_5x, high: conch_v1_20x}
    epochs: 50
  maple:
    method: maple
    features: {low: plip_10x, high: plip_20x}
    epochs: 200
  maple_5x20x:
    method: maple
    features: {low: plip_5x, high: plip_20x}
    epochs: 200
  vila_mil:
    method: vila_mil
    features: {low: clip_rn50_5x, high: clip_rn50_20x}
    epochs: 200
  cod_mil:
    method: cod_mil
    features: {low: clip_rn50_5x, high: clip_rn50_20x}
    epochs: 200
  top:
    method: top
    features: {bag: clip_rn50_10x}
    epochs: 8000
  slip:
    method: slip
    features: {bag: clip_rn50_10x}
    epochs: 10
  wsi_five:
    method: wsi_five
    features: {bag: wsi_five_medclip_20x}
    epochs: 30
  sldpc:
    method: sldpc
    features: {bag: titan_slide_20x}
    prompt_encoder:
      name: titan
      weights: /path/to/model-cache/huggingface/hub/models--MahmoodLab--TITAN/snapshots/dac6773d9961cfc75503440676ff157a2c6e8d2e
      model_id: MahmoodLab/TITAN
      revision: dac6773d9961cfc75503440676ff157a2c6e8d2e
      feature_space_id: hf:MahmoodLab/TITAN@dac6773d9961cfc75503440676ff157a2c6e8d2e
      local_files_only: true
    slide_projection: {mode: native}
    epochs: 100
  convlm:
    method: convlm
    features: {tiles: convlm_raw_tiles_20x}
    attribute_encoder:
      model_name: ViT-B-32
      weights: /path/to/model-cache/huggingface/hub/models--wisdomik--QuiltNet-B-32/snapshots/8ce77289ce35a90b2f1db1137dfa4bc2df175e33/open_clip_pytorch_model.bin
      feature_space_id: hf:wisdomik/QuiltNet-B-32
    epochs: 40
  composite:
    method: composite
    features: {bag: clip_rn50_10x}
    epochs: 200
