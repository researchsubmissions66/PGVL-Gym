site_name: PGVL-Gym
site_description: Generalized evaluation framework for pathology vision-language models
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  font: false
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.] 
          options:
            docstring_style: google
            filters:
              - "!^_"
            heading_level: 2
            inherited_members: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_if_no_docstring: false
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: true
            show_symbol_type_heading: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2026 PGVL-Gym contributors · Apache-2.0

extra:
  generator: false

nav:
  - Home: index.md
  - User guide:
      - Getting started: getting-started.md
      - Environment setup: environment.md
      - End-to-end tutorial: tutorial.md
      - Commands and run lifecycle: commands.md
      - Architecture: architecture.md
      - Configuration: configuration.md
      - Datasets and labels: datasets.md
      - Benchmark protocols: benchmarks.md
      - Results and reporting: results.md
      - Reproducibility: reproducibility.md
      - Troubleshooting: troubleshooting.md
      - Extending the framework: extending.md
  - Reference:
      - Method support matrix: support-matrix.md
      - Backbone interfaces: BACKBONE_INTERFACES.md
      - Glossary: glossary.md
  - API reference:
      - Registry and method contract: api/methods.md
      - Method adapters: api/adapters.md
      - Backbones: api/backbones.md
      - Feature loaders: api/datasets.md
      - Prompt compiler: api/prompts.md
      - Composite framework: api/composite.md
  - Contributing:
      - Writing documentation: contributing-docs.md
      - Deploying the project website: project-website.md
      - Project use and citation: project.md
