[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pgvl-gym"
version = "0.1.0"
description = "Registry-based benchmark for few-shot WSI vision-language methods"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "Apache-2.0"}
authors = [{name = "PGVL-Gym contributors"}]
dependencies = [
    "torch>=2.4,<2.7",
    "torchvision",
    "numpy>=1.24,<2",
    "scipy",
    "pandas",
    "pyyaml",
    "scikit-learn",
    "tensorboard",
    "tensorboardX",
    "h5py",
    "transformers>=4.40,<5",
    "ftfy",
    "regex",
    "tqdm",
    "termcolor",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
docs = [
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.27,<1",
    "ruff>=0.6",
]
preprocessing = [
    "openslide-python",
    "opencv-python-headless>=4.8,<4.12",
    "pillow",
    "matplotlib",
]
cod-mil = ["ml-collections", "yacs", "torch-geometric>=2.4,<3"]
maple = ["einops>=0.7", "nmslib", "torch-geometric>=2.4,<3"]
mscpt = ["torch-geometric>=2.4,<3", "pytorch-lightning>=2,<3"]
pathpt = ["nystrom-attention"]
pathpt-musk = ["nystrom-attention", "timm>=0.9,<1.0.16", "fairscale>=0.4.13",
               "sentencepiece"]
slip = ["nystrom-attention", "open-clip-torch>=2.24", "timm>=0.9,<1.0.16"]
wsi-five = [
    "diffdist",
    "imgaug",
    "peft>=0.10,<1",
    "timm>=0.9,<1.0.16",
    "yacs",
]
convlm = ["open-clip-torch>=2.24"]
sldpc = ["einops-exts"]
# Prompting a served language model needs only an HTTP client: vLLM pins torch
# hard and this project pins torch for its methods, so vLLM belongs in its own
# environment and is deliberately absent here. See docs/llm-assets.md.
llm = ["requests>=2.31"]
all = [
    "nystrom-attention",
    "open-clip-torch>=2.24",
    "einops>=0.7",
    "timm>=0.9,<1.0.16",
    "torch-geometric>=2.4,<3",
    "pytorch-lightning>=2,<3",
    "einops-exts",
    "openslide-python",
    "opencv-python-headless>=4.8,<4.12",
    "pillow",
    "matplotlib",
    "ml-collections",
    "yacs",
    "nmslib",
    "diffdist",
    "imgaug",
    "peft>=0.10,<1",
    "fairscale>=0.4.13",
    "sentencepiece",
]

[tool.setuptools.packages.find]
include = ["common*", "methods*", "clip*"]
