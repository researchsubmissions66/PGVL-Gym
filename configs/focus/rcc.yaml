# FOCUS / RCC / 16-shot / 10-fold
# Source: official `RCC.sh` style script from dddavid4real/FOCUS.
# FOCUS uses CONCH only.

method: "focus"
backbone: "conch"
feature_dim: 512
n_classes: 3
classnames: ["clear cell renal cell carcinoma", "papillary renal cell carcinoma", "chromophobe renal cell carcinoma"]
label_dict: {"CCRCC": 0, "PRCC": 1, "CHRCC": 2}

# --- few-shot setup ---
shots: 16
k: 10
k_start: 0
k_end: 10

# --- training ---
seed: 1
epochs: 200
lr: 1.0e-4
weight_decay: 1.0e-5
bag_loss: "ce"
drop_out: true
early_stopping: true
es_patience: 20
es_stop_epoch: 40

# --- model ---
prototype_number: 16
mode: "transformer"
loader_mode: "transformer"

# --- paths (fill in your own) ---
dataset_csv:    "splits/TCGA_RCC/dataset.csv"
data_folder_s:  "path/to/TCGA_RCC/features_5x_conch"
data_folder_l:  "path/to/TCGA_RCC/features_20x_conch"
split_dir:      "splits/TCGA_RCC_16shots_10folds"
text_prompt_path: "text_prompts/focus/TCGA_RCC_two_scale_text_prompt.csv"
focus_prompt_format: "headerless_low_then_high"
focus_prompt_file_classnames: [CCRCC, PRCC, CHRCC]
focus_prompt_file_sha256: "24c83ca73f7d8de17c6206189f9c8024a60b83336468cb976608fb1eb91aefb1"
focus_prompt_bank_sha256: "f311087ebf290b280746040886195a4731ad90c75b614f7a2886f27d17c3f422"
prompt_provenance: "generated"
prompt_source: "focus_generated_native_two_scale_csv"
conch_ckpt:     "ckpts/conch.pth"
results_dir:    "results/focus_rcc16"
