# FOCUS / LUNG / 16-shot / 10-fold
# Source: official `LUNG.sh` style script from dddavid4real/FOCUS.
# FOCUS uses CONCH only.

method: "focus"
backbone: "conch"
feature_dim: 512
n_classes: 2
classnames: ["lung adenocarcinoma", "lung squamous cell carcinoma"]
label_dict: {"LUAD": 0, "LUSC": 1}

# --- few-shot setup ---
shots: 16
k: 10
k_start: 0
k_end: 10

# --- training ---
seed: 1
epochs: 200
lr: 1.0e-4
weight_decay: 1.0e-5
bag_loss: "ce"
drop_out: true
early_stopping: true
es_patience: 20
es_stop_epoch: 40

# --- model ---
prototype_number: 16
mode: "transformer"
loader_mode: "transformer"

# --- paths (fill in your own) ---
dataset_csv:    "splits/TCGA_Lung/dataset.csv"
data_folder_s:  "path/to/TCGA_Lung/features_5x_conch"
data_folder_l:  "path/to/TCGA_Lung/features_20x_conch"
split_dir:      "splits/TCGA_Lung_16shots_10folds"
text_prompt_path: "text_prompts/focus/TCGA_NSCLC_two_scale_text_prompt.csv"
focus_prompt_format: "headerless_low_then_high"
focus_prompt_file_classnames: [LUAD, LUSC]
focus_prompt_file_sha256: "a8df24b0adbfa15369b51fb31f17adef4a9a6b955d25cd9ab0e09f3284c76c50"
focus_prompt_bank_sha256: "a966d04324b31fe04b81874d5bbace791fd44347eac19bef0fa73d7a4c156b3c"
prompt_provenance: "upstream"
prompt_source: "focus_upstream_native_two_scale_csv"
conch_ckpt:     "ckpts/conch.pth"
results_dir:    "results/focus_lung16"
