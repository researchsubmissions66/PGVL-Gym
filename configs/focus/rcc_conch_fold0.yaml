# Fresh standard FOCUS + CONCH training on patient-disjoint TCGA-RCC fold 0.
# This configuration intentionally uses no UCCA model, checkpoint, feature,
# alignment artifact, or training result.
method: focus
backbone: conch
feature_dim: 512
n_classes: 3
classnames: [CCRCC, PRCC, CHRCC]
label_dict: {CCRCC: 0, PRCC: 1, CHRCC: 2}

# One 16-shot fold: 48 train, 48 validation, and the held-out test cohort.
shots: 16
k: 1
k_start: 0
k_end: 1
seed: 1

# Standard FOCUS optimization recipe.
epochs: 200
lr: 1.0e-4
weight_decay: 1.0e-5
early_stopping: true
es_patience: 20
es_stop_epoch: 40
bag_loss: ce
drop_out: true

# Standard FOCUS architecture.
prototype_number: 16
window_size: 7
sim_threshold: 0.7
max_context_length: 4096
mode: transformer
loader_mode: transformer

# Reuse the existing non-UCCA RCC CONCH feature manifest directly. The
# PGVL-Gym loader reads these native HDF5 paths without conversion.
dataset_csv: /path/to/PathoGEPA/data/tcga_rcc_maple_conch_fold0.csv
label_column: OncoTreeCode
feature_path_column_s: feature_path_s
feature_path_column_l: feature_path_l
feature_key: features
data_folder_s: null
data_folder_l: null
split_dir: /path/to/PathoGEPA/data/splits/tcga_rcc_maple_conch_16shot_fold0

text_prompt_path: /path/to/PGVL-Gym/text_prompts/focus/TCGA_RCC_two_scale_text_prompt.csv
conch_ckpt: /path/to/model-cache/huggingface/hub/models--MahmoodLab--conch/snapshots/f9ca9f877171a28ade80228fb195ac5d79003357/pytorch_model.bin
results_dir: /path/to/PGVL-Gym/results/focus_rcc_conch_16shot_fold0
