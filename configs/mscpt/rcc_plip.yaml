# MSCPT / RCC / 8-shot / 5-seed / PLIP backbone
# Source: scripts/mscpt/train_my_rcc.sh from Hanminghao/MSCPT.
# NOTE: MSCPT uses different epoch counts per backbone:
#   CLIP=100, PLIP=50, CONCH=50.

method: "mscpt"
backbone: "plip"
n_classes: 3
classnames: ["clear cell renal cell carcinoma", "papillary renal cell carcinoma", "chromophobe renal cell carcinoma"]
label_dict: {"CCRCC": 0, "PRCC": 1, "CHRCC": 2}
dataset_name: "RCC"

shots: 8
k: 5
k_start: 0
k_end: 5

seed: 1
epochs: 50
lr: 1.0e-4
weight_decay: 1.0e-5
batch_size: 1
num_workers: 4

n_tpro: 2
n_vpro: 2
n_set: 5
num_k: 100

dataset_csv:     "tcga_rcc.csv"
feat_data_dir:   "path/to/TCGA_RCC/plip/pt_files"
selected_5x_dir: "path/to/TCGA_RCC/selected_5x_patches"
gpt_dir:         "./train_data/gpt"
split_dir:       "numshots/RCC_8shot_5fold"
results_dir:     "results/mscpt_rcc8_plip"
