# SLIP / UBC / 1-shot
# Source: main.py defaults from LTS5/SLIP.
# Backbones: CLIP / BiomedCLIP / PLIP / CLIP-RN50.

method: "slip"
backbone: "CLIP"
n_classes: 5
classnames: ["HGSC", "LGSC", "EC", "CC", "MC"]
label_dict: {"HGSC": 0, "LGSC": 1, "EC": 2, "CC": 3, "MC": 4}

shots: 1
k: 5

seed: 0
epochs: 10                  # SLIP runs only a handful of epochs
lr: 2.0e-3
weight_decay: 0.0
batch_size: 1
early_stopping: false

context_size: 1
context_gain: 0.01
topk: 50
temp: 0.01
image_size: 224

dataroot: "./data"
dataset_csv: "splits/UBC-OCEAN/dataset.csv"
data_folder_s: "path/to/UBC-OCEAN/clip_features"
split_dir:   "splits/SLIP_UBC-OCEAN_1shot"
results_dir: "results/slip_ubc_1shot"
