# SLIP / LUNG / 1-shot
# Source: main.py defaults from LTS5/SLIP.
# Backbones: CLIP / BiomedCLIP / PLIP / CLIP-RN50.

method: "slip"
backbone: "CLIP"
n_classes: 2
classnames: ["lung adenocarcinoma", "lung squamous cell carcinoma"]
label_dict: {"LUAD": 0, "LUSC": 1}

shots: 1
k: 5

seed: 0
epochs: 10                  # SLIP runs only a handful of epochs
lr: 2.0e-3
weight_decay: 0.0
batch_size: 1
early_stopping: false

context_size: 1
context_gain: 0.01
topk: 50
temp: 0.01
image_size: 224

dataroot: "./data"
dataset_csv: "splits/TCGA_Lung/dataset.csv"
data_folder_s: "path/to/TCGA_Lung/clip_features"
split_dir:   "splits/SLIP_TCGA_Lung_1shot"
results_dir: "results/slip_lung_1shot"
