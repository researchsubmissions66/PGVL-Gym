# ConVLM / zero-shot TCGA-NSCLC example.
# PGVL's partial ConVLM reconstruction consumes offline patch bags, not RGB
# tiles. The released train.py instead trains its ViT from RGB images; its
# separate UNI extraction utility is not wired to that training path. Each
# split CSV may name an exact bag in `feature_path`; otherwise the loader
# resolves `<data_folder_s>/<slide_id>.pt`.
method: "convlm"
n_classes: 2
classnames: ["lung adenocarcinoma", "lung squamous cell carcinoma"]
label_dict: {"LUAD": 0, "LUSC": 1}
seen_class_indices: [0]  # train.csv contains LUAD; test.csv may contain LUSC

data_folder_s: "path/to/TCGA_Lung/uni_features"
feature_path_column: "feature_path"
feature_key: "features"
feature_dim: 1024
split_dir: "splits/ConVLM_TCGA_Lung_zsl"
# This must be a metadata-bound .pt mapping, never a bare tensor/.npy. Required
# keys are: schema=pgvl.convlm.attribute_embeddings.v1, embeddings, classnames,
# feature_space_id, prompt_bank_sha256, prompt_provenance, and encoder metadata
# (model_name, weights, feature_space_id, checkpoint_sha256). The upstream
# att_splits.mat is not released and its generation script is unusable.
attribute_embeddings: "path/to/convlm_lung_quiltnet_attributes.pt"
attribute_feature_space_id: "hf:wisdomik/QuiltNet-B-32"
prompt_provenance: "generated"
prompt_source: "convlm_precomputed_attribute_embeddings"

embed_dim: 768
depth: 12
num_heads: 12
keep_rate: 0.7
max_patches: 4096
batch_size: 1
num_workers: 4
epochs: 40
lr: 1.0e-4
weight_decay: 1.0e-5
lr_milestones: [10, 20, 30]
loss_global_alignment: 1.0
loss_sr: 1.0
early_stopping: false
results_dir: "results/convlm_lung_zsl"
