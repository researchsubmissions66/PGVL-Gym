# TOP / RCC / 16-shot
# Source: exp_TCGA.sh from miccaiif/TOP.
# IMPORTANT: TOP uses VERY different hyper-parameters from the rest:
#   LR ~ 0.02 (vs 1e-4),  epochs = 8000 (vs 20-200).

method: "top"
clip_arch: "RN50"
n_classes: 3
classnames: ["clear cell renal cell carcinoma", "papillary renal cell carcinoma", "chromophobe renal cell carcinoma"]
label_dict: {"CCRCC": 0, "PRCC": 1, "CHRCC": 2}

shots: 16
k: 5

seed: 0
epochs: 8000
lr: 0.02
lr_TB: 0.02
lr_IB: 0.02
weight_decay: 0.0
early_stopping: false

n_ctx_bag: 4
n_ctx_inst: 4
ctx_init_bag: ""
ctx_init_inst: ""
instance_prompt_path: "${PGVL_REPO_ROOT}/text_prompts/top/instance_prototypes.json"
top_prompt_format: "instance_prototypes_plus_optional_bag_context.v1"
top_instance_file_sha256: "33a95e5e41c33459c8cf79abe68e1275986a952758c67705da02b1f7d102d0db"
top_instance_prompt_bank_sha256: "56ae6c7ec40cb2dace3bbe2897d73ec70d0f7c4564d5d69b19912543554b0cd2"
top_instance_provenance: "upstream"
prompt_provenance: "upstream_instance_with_random_classname_bag"
prompt_source: "top_upstream_instance_with_random_classname_bag"
csc: true
p_drop_out: 0.2
p_bag_drop_out: 0.2
weight_lossA: 25
pooling_strategy: "learnablePrompt_multi"

dataset_csv: "splits/TCGA_RCC/dataset.csv"
data_folder_s: "path/to/TCGA_RCC/clip_features"
split_dir:   "splits/TOP_TCGA_RCC_16shot"
results_dir: "results/top_rcc16"
