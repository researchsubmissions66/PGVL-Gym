# WSI-FiVE / RCC
# Source: configs/wsi/fix_pth.yaml from ls1rius/WSI_FiVE.
# Local classname baseline: WSI-FiVE publishes no RCC answer/evaluation bank.

method: "wsi_five"
backbone: "wsi-five-vit"  # FiVE consumes precomputed 512-d patch features
n_classes: 3
classnames: ["clear cell renal cell carcinoma", "papillary renal cell carcinoma", "chromophobe renal cell carcinoma"]
label_dict: {"CCRCC": 0, "PRCC": 1, "CHRCC": 2}

seed: 0
epochs: 30
lr: 8.0e-6
weight_decay: 0.05
batch_size: 1
num_frames: 2048
T_mit: 8
is_img_pth: true
training_mode: "simplified_classnames"
require_report: false
clinical_questions: "text_prompts/wsi_five/clinical_questions/rcc.json"

dataset:    "tcga"
data_path:  "path/to/TCGA_RCC"

dataset_csv: "splits/TCGA_RCC/dataset.csv"
data_folder_s: "path/to/TCGA_RCC/features"
split_dir:    "splits/WSI_FiVE_TCGA_RCC"
results_dir:  "results/wsi_five_rcc"
