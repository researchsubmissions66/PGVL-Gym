# ViLa-MIL / UBC / 16-shot / 5-fold
# ViLa-MIL publishes no UBC-OCEAN prompt bank; this uses a generated native-
# format task extension. File order is explicit and runtime-reordered below.

method: "vila_mil"
backbone: "clip-rn50"
feature_dim: 1024
n_classes: 5
classnames: ["HGSC", "LGSC", "EC", "CC", "MC"]
label_dict: {"HGSC": 0, "LGSC": 1, "EC": 2, "CC": 3, "MC": 4}

shots: 16
k: 5
k_start: 0
k_end: 5

seed: 1
epochs: 200
lr: 1.0e-4
weight_decay: 1.0e-5
bag_loss: "ce"
drop_out: true
early_stopping: true
es_patience: 20
es_stop_epoch: 80          # ViLa-MIL uses a longer warm-up than FOCUS

prototype_number: 16
mode: "transformer"
loader_mode: "transformer"

dataset_csv:    "splits/UBC-OCEAN/dataset.csv"
data_folder_s:  "path/to/UBC-OCEAN/feats_5x"
data_folder_l:  "path/to/UBC-OCEAN/feats_20x"
split_dir:      "splits/task_UBC-OCEAN_subtyping_16shots_5folds"
text_prompt_path: "text_prompts/vila_mil/UBC_OCEAN_two_scale_text_prompt.csv"
vila_prompt_format: "headerless_low_then_high"
vila_prompt_file_classnames: [CC, EC, HGSC, LGSC, MC]
vila_prompt_file_sha256: "f2a8e2c2ab45f0aece457029666fcce2f0a467a9c96ed7b866415ef70f9ba788"
vila_prompt_bank_sha256: "a693ac313d96ed3dd588507cca47de413cee4dc570a22ac35ff2639d70e7b418"
prompt_provenance: "generated"
prompt_source: "vila_mil_generated_native_two_scale_csv"
results_dir:    "results/vila_mil_ubc16"
