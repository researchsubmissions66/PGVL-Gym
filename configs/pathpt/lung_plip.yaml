# PathPT / LUNG / 10-shot / PLIP backbone
# Source: official train.py defaults from MAGIC-AI4Med/PathPT.
# IMPORTANT: hyperparameters are intentionally identical across
# all four backbones (PLIP / CONCH / KEEP / MUSK) -- only
# `backbone` and `feature_root` change.  This is the paper's
# fair-comparison recipe.

method: "pathpt"
backbone: "plip"
n_classes: 2
classnames: ["lung adenocarcinoma", "lung squamous cell carcinoma"]
label_dict: {"LUAD": 0, "LUSC": 1}

shots: 10
k: 10
k_start: 0
k_end: 10

# --- training (locked across backbones) ---
seed: 42
epochs: 20
lr: 1.0e-4
batch_size: 1
n_ctx: 32
prompt_init: "template"
aux_weight: 0.5
learnable: "token"
vision_only: false
vision_grad: true
use_aug: false
loss_weight: [1.0, 0.5, 0.1]

# --- features ---
feature_root: "features/plip/lung/h5_files"
patch_num: null
loader_mode: "h5"

# --- paths ---
dataset_csv:  "multifold/dataset_csv_10shot/LUNG/fold0.csv"
split_dir:    "multifold/dataset_csv_10shot/LUNG"
results_dir:  "results/pathpt_lung_plip_10shot"
